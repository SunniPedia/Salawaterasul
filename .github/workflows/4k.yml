name: Image + Audio to Surah Video - 4K Fixed

on:
  workflow_dispatch:
    inputs:
      surah_number:
        description: 'কোন সুরার ভিডিও বানাবে? (যেমন: 001, 002)'
        required: true
        default: '001'
        type: string
      image_folder:
        description: 'Image folder'
        required: false
        default: 'output'
        type: string
      audio_folder:
        description: 'Audio folder'
        required: false
        default: 'rizwanaudio'
        type: string

jobs:
  make-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Make Surah Video - 4K - Dual Format Support
        run: |
          IMG_DIR="${{ inputs.image_folder }}"
          AUDIO_DIR="${{ inputs.audio_folder }}"
          SURAH="${{ inputs.surah_number }}"
          TEMP_VIDEO_DIR="temp_${SURAH}_videos"
          FINAL_DIR="rizwanSurahVideo"

          mkdir -p "$TEMP_VIDEO_DIR"
          mkdir -p "$FINAL_DIR"
          rm -f "$FINAL_DIR/${SURAH}.mp4"

          # Case 1: Single file format - 001.jpg + 001.mp3
          if [ -f "$IMG_DIR/${SURAH}.jpg" ] && [ -f "$AUDIO_DIR/${SURAH}.mp3" ]; then
            echo "Found single format: ${SURAH}.jpg + ${SURAH}.mp3"
            ffmpeg -y -hide_banner -loglevel error \
              -loop 1 -i "$IMG_DIR/${SURAH}.jpg" \
              -i "$AUDIO_DIR/${SURAH}.mp3" \
              -c:v libx264 -tune stillimage -preset medium -crf 18 \
              -vf "scale=3840:2160:force_original_aspect_ratio=increase,crop=3840:2160,setsar=1,fps=30" \
              -c:a aac -b:a 192k \
              -pix_fmt yuv420p -shortest \
              "$FINAL_DIR/${SURAH}.mp4"

          # Case 2: Ayat format - 001001.jpg + 001001.mp3
          else
            echo "Single format not found, trying Ayat format: ${SURAH}*.jpg"
            for img_file in "$IMG_DIR"/${SURAH}*.jpg; do
              [ -e "$img_file" ] || continue
              file_name=$(basename "$img_file")
              base="${file_name%.*}"
              audio_file="$AUDIO_DIR/$base.mp3"

              echo "Processing: $file_name -> $base.mp4"

              if [ -f "$audio_file" ]; then
                ffmpeg -y -hide_banner -loglevel error \
                  -loop 1 -i "$img_file" \
                  -i "$audio_file" \
                  -c:v libx264 -tune stillimage -preset medium -crf 18 \
                  -vf "scale=3840:2160:force_original_aspect_ratio=increase,crop=3840:2160,setsar=1,fps=30" \
                  -c:a aac -b:a 192k \
                  -pix_fmt yuv420p -shortest \
                  "$TEMP_VIDEO_DIR/$base.mp4"
              fi
            done

            if! ls "$TEMP_VIDEO_DIR"/${SURAH}*.mp4 1> /dev/null 2>&1; then
              echo "ERROR: No image/audio found for Surah $SURAH"
              echo "Checked: $IMG_DIR/${SURAH}.jpg and $IMG_DIR/${SURAH}*.jpg"
              echo "And audios: $AUDIO_DIR/${SURAH}.mp3 and $AUDIO_DIR/${SURAH}*.mp3"
              exit 1
            fi

            ls -1 "$TEMP_VIDEO_DIR"/${SURAH}*.mp4 | sort -V > video_list_raw.txt

            rm -f concat_videos.txt
            while read f; do
              echo "file '$PWD/$f'" >> concat_videos.txt
            done < video_list_raw.txt

            ffmpeg -y -f concat -safe 0 -i concat_videos.txt -c copy "$FINAL_DIR/${SURAH}.mp4"
            rm -rf "$TEMP_VIDEO_DIR" concat_videos.txt video_list_raw.txt
          fi

          ls -lh "$FINAL_DIR"/

      - name: Upload Final Video
        uses: actions/upload-artifact@v4
        with:
          name: Surah-${{ inputs.surah_number }}-4K-Video
          path: rizwanSurahVideo/

      - name: Commit Video to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f rizwanSurahVideo/
          git commit -m "Added Surah ${{ inputs.surah_number }} 4K Video" || echo "No changes"
          git push || echo "Push failed - file >100MB, use Artifact"
