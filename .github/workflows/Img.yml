name: Generate Salawat Images

on:
  workflow_dispatch:
    inputs:
      arabic_name:
        description: 'পারার নাম (আরবি - নিচে থাকবে)'
        required: true
        type: string
      bangla_name:
        description: 'পৃষ্ঠার নাম (বাংলা - পারার নামের নিচে থাকবে)'
        required: true
        type: string
      subtitle_text:
        description: 'সাবটাইটেল'
        required: false
        default: 'প্রিয় নবী ﷺ''র নূর ও প্রকাশ প্রসঙ্গে'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install Pillow

      - name: Generate Salawat Images
        env:
          ARABIC_NAME: ${{ inputs.arabic_name }}
          BANGLA_NAME: ${{ inputs.bangla_name }}
          SUBTITLE_TEXT: ${{ inputs.subtitle_text }}
        run: |
          python3 << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          import json, os, shutil

          BG="src/background.jpg"
          LOGO="src/logo.jpg"
          DATA="src/data.json"
          OUT="output"
          FONT_BN="src/solaimanlipi.ttf"
          FONT_AR="src/noorehuda.ttf"

          def normalize_ar(text):
              return text.replace('\u0671', '\u0627')

          PARA=normalize_ar(os.environ.get("ARABIC_NAME","").strip())
          PAGE=os.environ.get("BANGLA_NAME","").strip()
          SUB=os.environ.get("SUBTITLE_TEXT","").strip() or "প্রিয় নবী ﷺ'র নূর ও প্রকাশ প্রসঙ্গে"

          if os.path.exists(OUT):
              shutil.rmtree(OUT)
          os.makedirs(OUT, exist_ok=True)

          EN_TO_BN=str.maketrans("0123456789","০১২৩৪৫৬৭৮৯")
          def to_bn(s): return str(s).translate(EN_TO_BN)

          W,H=3840,2160
          bg_img=Image.open(BG).convert("RGB") if os.path.exists(BG) else Image.new("RGB",(W,H),(232,236,244))
          W,H=bg_img.size
          LEFT_W=int(W*0.22)
          SCALE=W/1280

          def font(is_ar, dp):
              path=FONT_AR if is_ar else FONT_BN
              try: return ImageFont.truetype(path, int(dp*SCALE))
              except: return ImageFont.load_default()

          # FIX: ﷺ অংশে ফন্ট ইউজ না করার মানে - বাংলা ফন্টে নেই, তাই শুধু ওই চিহ্নটা আরবি ফন্টে আঁকবে, শব্দ ভাঙবে না
          def draw_bn_with_sallallahu(draw_obj, x, y, text, font_bn, font_ar, fill):
              # ﷺ দিয়ে ভাগ করো, প্রতি টুকরা আস্ত থাকবে
              parts = text.split('ﷺ')
              cur_x = x
              for i, part in enumerate(parts):
                  if part:
                      draw_obj.text((cur_x, y), part, font=font_bn, fill=fill)
                      cur_x += draw_obj.textlength(part, font=font_bn)
                  if i < len(parts)-1:
                      # এই অংশটাই আরবি ফন্টে
                      draw_obj.text((cur_x, y), 'ﷺ', font=font_ar, fill=fill)
                      cur_x += draw_obj.textlength('ﷺ', font=font_ar)
              return cur_x

          def textlength_mixed(text, font_bn, font_ar, draw_obj):
              parts = text.split('ﷺ')
              w=0
              for i, part in enumerate(parts):
                  if part:
                      w+=draw_obj.textlength(part, font=font_bn)
                  if i < len(parts)-1:
                      w+=draw_obj.textlength('ﷺ', font=font_ar)
              return w

          with open(DATA, encoding="utf-8") as f:
              data=json.load(f)

          for item in data:
              id_int=int(item.get('id',0))
              filename=f"{id_int:04d}.jpg"
              id_bn=to_bn(str(id_int))

              bg=bg_img.resize((W,H), Image.LANCZOS)
              draw=ImageDraw.Draw(bg)
              draw.rectangle([0,0,LEFT_W,H], fill=(214,218,228))

              if os.path.exists(LOGO):
                  try:
                      ls=int(200*SCALE)
                      logo=Image.open(LOGO).convert("RGBA").resize((ls,ls), Image.LANCZOS)
                      bg.paste(logo,(int((LEFT_W-ls)//2), int(30*SCALE)), logo)
                  except: pass

              f_title_bn=font(False, 34)
              f_title_ar=font(True, 34)
              f_sub_bn=font(False, 26)
              f_sub_ar=font(True, 26)
              f_para=font(True, 52)
              f_page_bn=font(False, 48)
              f_page_ar=font(True, 48)
              f_num=font(False, 42)
              f_ar=font(True, 78)
              f_tr=font(False, 40)
              f_bn=font(False, 46)
              f_label=font(False, 36)

              max_left=LEFT_W-int(40*SCALE)
              max_right=W-LEFT_W-int(140*SCALE)

              def wrap(text, fn_bn, fn_ar, max_w):
                  # ﷺ সহ মাপ
                  lines=[]; cur=""
                  for w in text.split():
                      test=f"{cur} {w}".strip()
                      if textlength_mixed(test, fn_bn, fn_ar, draw) <= max_w:
                          cur=test
                      else:
                          if cur: lines.append(cur)
                          cur=w
                  if cur: lines.append(cur)
                  return lines

              y=int(260*SCALE)
              # টাইটেল - ﷺ সহ
              title_text="মাজমূ’আহ্ সালাওয়াতির রসূল ﷺ"
              for line in wrap(title_text, f_title_bn, f_title_ar, max_left):
                  w=textlength_mixed(line, f_title_bn, f_title_ar, draw)
                  sx=(LEFT_W-w)//2
                  draw_bn_with_sallallahu(draw, sx, y, line, f_title_bn, f_title_ar, (15,25,85))
                  y+=int(34*SCALE*1.5)
              y+=int(6*SCALE)
              for line in wrap(SUB, f_sub_bn, f_sub_ar, max_left):
                  w=textlength_mixed(line, f_sub_bn, f_sub_ar, draw)
                  sx=(LEFT_W-w)//2
                  draw_bn_with_sallallahu(draw, sx, y, line, f_sub_bn, f_sub_ar, (60,60,80))
                  y+=int(26*SCALE*1.45)

              y+=int(16*SCALE)
              draw.line([(int(40*SCALE), y), (LEFT_W-int(40*SCALE), y)], fill=(100,100,120), width=2)

              bottom_y = H - int(160*SCALE)
              # PARA আরবি, তাই সরাসরি
              pw=draw.textlength(PARA, font=f_para)
              draw.text(((LEFT_W-pw)//2, bottom_y - int(80*SCALE)), PARA, font=f_para, fill=(20,20,60))
              # PAGE তেও ﷺ থাকতে পারে
              pgw=textlength_mixed(PAGE, f_page_bn, f_page_ar, draw)
              draw_bn_with_sallallahu(draw, (LEFT_W-pgw)//2, bottom_y, PAGE, f_page_bn, f_page_ar, (20,20,60))

              # ID Circle
              dia=int(110*SCALE)
              cx=W-dia-int(50*SCALE)
              cy=int(50*SCALE)
              draw.ellipse([(cx,cy),(cx+dia,cy+dia)], fill=(35,45,85))
              nw=draw.textlength(id_bn, font=f_num)
              draw.text((cx+(dia-nw)//2, cy+(dia-int(42*SCALE))//2), id_bn, font=f_num, fill=(255,255,255))

              ar_lines=wrap(normalize_ar(item.get('arabic','')), f_ar, f_ar, max_right)
              tr_lines=wrap(item.get('transliteration',''), f_tr, f_tr, max_right)
              bn_lines=wrap(item.get('bengali',''), f_bn, f_bn, max_right)

              total=len(ar_lines)*int(78*SCALE*1.5)+len(tr_lines)*int(40*SCALE*1.5)+len(bn_lines)*int(46*SCALE*1.4)+250
              sy=max(int(140*SCALE), (H-total)//2)
              yy=sy
              for line in ar_lines:
                  ww=draw.textlength(line, font=f_ar)
                  draw.text((W-int(70*SCALE)-ww, yy), line, font=f_ar, fill=(0,0,0))
                  yy+=int(78*SCALE*1.5)
              yy+=int(35*SCALE)
              for line in tr_lines:
                  draw.text((LEFT_W+int(50*SCALE), yy), line, font=f_tr, fill=(60,60,60))
                  yy+=int(40*SCALE*1.5)
              yy+=int(25*SCALE)
              draw.text((LEFT_W+int(50*SCALE), yy), "বঙ্গানুবাদ:", font=f_label, fill=(20,40,120))
              yy+=int(60*SCALE)
              for line in bn_lines:
                  draw.text((LEFT_W+int(50*SCALE), yy), line, font=f_bn, fill=(15,25,85))
                  yy+=int(46*SCALE*1.4)

              bg.save(os.path.join(OUT, filename), "JPEG", quality=95, subsampling=0)

          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: salawat-images
          path: output/
          retention-days: 7

      - name: Push output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/
          git commit -m "fix: keep ﷺ with ar font, no per-char break" || echo "no changes"
          git push
