name: Generate Salawat Images

on:
  workflow_dispatch:
    inputs:
      arabic_name:
        description: 'পারার নাম (আরবি - নিচে থাকবে)'
        required: true
        type: string
      bangla_name:
        description: 'পৃষ্ঠার নাম (বাংলা - পারার নামের নিচে থাকবে)'
        required: true
        type: string
      subtitle_text:
        description: 'সাবটাইটেল (টাইটেলের নিচে থাকবে)'
        required: false
        default: 'প্রিয় নবী ﷺ''র নূর ও প্রকাশ প্রসঙ্গে'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install Pillow

      - name: Generate Salawat Images
        env:
          ARABIC_NAME: ${{ inputs.arabic_name }}
          BANGLA_NAME: ${{ inputs.bangla_name }}
          SUBTITLE_TEXT: ${{ inputs.subtitle_text }}
        run: |
          python3 << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          import json, os, re, shutil

          BG="src/background.jpg"
          LOGO="src/logo.jpg"
          DATA="src/data.json"
          OUT="output"
          FONT_BN="src/solaimanlipi.ttf"
          FONT_AR="src/noorehuda.ttf"

          def normalize_arabic_display(text):
              return text.replace('\u0671', '\u0627')

          PARA_NAME=normalize_arabic_display(os.environ.get("ARABIC_NAME","").strip())
          PAGE_NAME=os.environ.get("BANGLA_NAME","").strip()
          SUBTITLE= os.environ.get("SUBTITLE_TEXT","").strip() or "প্রিয় নবী ﷺ'র নূর ও প্রকাশ প্রসঙ্গে"

          if os.path.exists(OUT):
              shutil.rmtree(OUT)
          os.makedirs(OUT, exist_ok=True)

          EN_TO_BN=str.maketrans("0123456789","০১২৩৪৫৬৭৮৯")
          def to_bangla_num(s): return str(s).translate(EN_TO_BN)

          W,H=3840,2160
          bg_img=Image.open(BG).convert("RGB") if os.path.exists(BG) else Image.new("RGB",(W,H),(232,236,244))
          W,H=bg_img.size
          LEFT_W=int(W*0.22)
          SCALE=W/1280

          def get_font_by_size(is_ar, px_size):
              p=FONT_AR if is_ar else FONT_BN
              try: return ImageFont.truetype(p, int(px_size))
              except: return ImageFont.load_default()
          def get_font(is_ar, dp):
              return get_font_by_size(is_ar, dp*SCALE)

          with open(DATA, encoding="utf-8") as f:
              data=json.load(f)

          BASE_TITLE = 38
          BASE_SUBTITLE = 28
          BASE_DETAILS_AR = 60
          BASE_DETAILS_BN = 60
          BASE_AR = 85
          BASE_TRANS = 46
          BASE_BN = 52

          TOP_MARGIN = int(140*SCALE)
          BOTTOM_MARGIN = int(180*SCALE) # FIX: নিচে কাটা ঠেকাতে বাড়ানো হলো

          # FIX: ﷺ বক্স সমস্যা সমাধানের জন্য মিক্সড ড্র ফাংশন
          def draw_mixed_text(draw_obj, x, y, text, font_bn, font_ar, fill):
              # ﷺ এই ক্যারেক্টারটা বাংলা ফন্টে নেই, আরবি ফন্টে আছে
              # তাই টেক্সটকে ভেঙে ভেঙে আঁকবে
              cur_x = x
              for ch in text:
                  if ch == 'ﷺ' or '\uFDFA' in ch or '\uFDFD' in ch or ord(ch) == 65018: # ﷺ
                      f = font_ar
                  else:
                      f = font_bn
                  draw_obj.text((cur_x, y), ch, font=f, fill=fill)
                  cur_x += draw_obj.textlength(ch, font=f)
              return cur_x

          def wrap_mixed(text, font_bn, font_ar, max_w, draw_obj):
              # ﷺ সহ wrap করার জন্য সরল wrap
              lines=[]
              cur=""
              for w in text.split():
                  test=f"{cur} {w}".strip()
                  # মাপার সময় আরবি ফন্ট দিয়েও মাপতে হবে
                  w_len = 0
                  for ch in test:
                      f = font_ar if ch == 'ﷺ' else font_bn
                      w_len += draw_obj.textlength(ch, font=f)
                  if w_len <= max_w:
                      cur=test
                  else:
                      if cur: lines.append(cur)
                      cur=w
              if cur: lines.append(cur)
              return lines

          with open(DATA, encoding="utf-8") as f:
              data=json.load(f)

          _dummy_draw=ImageDraw.Draw(Image.new("RGB",(10,10)))

          for item in data:
              id_int = int(item.get('id', 0))
              filename=f"{id_int:04d}.jpg"
              id_disp_bn = to_bangla_num(str(id_int))

              bg=bg_img.resize((W,H), Image.LANCZOS)
              draw=ImageDraw.Draw(bg)
              draw.rectangle([0,0,LEFT_W,H], fill=(214,218,228))

              if os.path.exists(LOGO):
                  try:
                      ls=int(200*SCALE)
                      logo=Image.open(LOGO).convert("RGBA").resize((ls,ls), Image.LANCZOS)
                      bg.paste(logo,(int((LEFT_W-ls)//2), int(30*SCALE)), logo)
                  except: pass

              f_title = get_font(False, BASE_TITLE)
              f_title_ar = get_font(True, BASE_TITLE)
              f_subtitle = get_font(False, BASE_SUBTITLE)
              f_subtitle_ar = get_font(True, BASE_SUBTITLE)

              max_title_w = LEFT_W - int(40*SCALE)
              title_text = "মাজমূ’আহ্ সালাওয়াতির রসূল ﷺ"

              title_lines = wrap_mixed(title_text, f_title, f_title_ar, max_title_w, draw)
              subtitle_lines = wrap_mixed(SUBTITLE, f_subtitle, f_subtitle_ar, max_title_w, draw)

              title_y = int(260*SCALE)
              for line in title_lines:
                  # সেন্টার করার জন্য total width
                  total_w = sum(draw.textlength(ch, font=(f_title_ar if ch=='ﷺ' else f_title)) for ch in line)
                  sx = (LEFT_W - total_w)//2
                  draw_mixed_text(draw, sx, title_y, line, f_title, f_title_ar, (15,25,85))
                  title_y += int(BASE_TITLE*SCALE*1.5)

              title_y += int(8*SCALE)
              for line in subtitle_lines:
                  total_w = sum(draw.textlength(ch, font=(f_subtitle_ar if ch=='ﷺ' else f_subtitle)) for ch in line)
                  sx = (LEFT_W - total_w)//2
                  draw_mixed_text(draw, sx, title_y, line, f_subtitle, f_subtitle_ar, (70,70,90))
                  title_y += int(BASE_SUBTITLE*SCALE*1.5)

              title_y += int(20*SCALE)
              draw.line([(int(40*SCALE), title_y), (int(LEFT_W-40*SCALE), title_y)], fill=(100,100,120), width=int(2*SCALE))

              # FIX: পারা/পৃষ্ঠার নাম যাতে কাটা না পড়ে, তাই Y পজিশন উপরে তোলা হলো
              f_ar_det=get_font_by_size(True, 54*SCALE)
              f_bn_det=get_font_by_size(False, 54*SCALE)
              names_y = H - BOTTOM_MARGIN - int(160*SCALE) # একদম নিচ থেকে ১৬০px উপরে

              # যদি টাইটেল অনেক বড় হয়, তাহলে নাম আরও নিচে নামবে না
              if names_y < title_y + int(30*SCALE):
                  names_y = title_y + int(30*SCALE)

              # পারা
              total_w_ar = sum(draw.textlength(ch, font=f_ar_det) for ch in PARA_NAME)
              ar_x = (LEFT_W - total_w_ar)//2
              draw.text((ar_x, names_y), PARA_NAME, font=f_ar_det, fill=(20,20,60))

              # পৃষ্ঠা
              total_w_bn = sum(draw.textlength(ch, font=(f_bn_det if ch!='ﷺ' else get_font_by_size(True, 54*SCALE))) for ch in PAGE_NAME)
              bn_x = (LEFT_W - total_w_bn)//2
              dy = names_y + int(60*SCALE*1.6)
              # পৃষ্ঠার নামেও ﷺ থাকতে পারে তাই mixed
              draw_mixed_text(draw, bn_x, dy, PAGE_NAME, f_bn_det, get_font_by_size(True, 54*SCALE), (20,20,60))

              # ID Circle
              f_circle_num = get_font(False, 42)
              circle_dia = int(110*SCALE)
              circle_x = W - circle_dia - int(50*SCALE)
              circle_y = int(50*SCALE)
              draw.ellipse([(circle_x, circle_y), (circle_x+circle_dia, circle_y+circle_dia)], fill=(35,45,85))
              num_w = draw.textlength(id_disp_bn, font=f_circle_num)
              draw.text((circle_x + (circle_dia - num_w)//2, circle_y + (circle_dia - 42*SCALE)//2), id_disp_bn, font=f_circle_num, fill=(255,255,255))

              # মূল লেখা
              max_w=W-LEFT_W-int(140*SCALE)
              temp_AR = BASE_AR
              while True:
                  f_ar=get_font(True, temp_AR)
                  arabic_raw=normalize_arabic_display(item.get('arabic','').strip())
                  arabic_lines=[]
                  cur=""
                  for w in arabic_raw.split():
                      test=f"{cur} {w}".strip()
                      if draw.textlength(test, font=f_ar) <= max_w:
                          cur=test
                      else:
                          if cur: arabic_lines.append(cur)
                          cur=w
                  if cur: arabic_lines.append(cur)
                  ar_block_h = len(arabic_lines) * int(temp_AR*SCALE*1.5)
                  if ar_block_h <= (H*0.5) or temp_AR <= 48:
                      BASE_AR_CURR = temp_AR
                      break
                  temp_AR -= 2
              f_ar = get_font(True, BASE_AR_CURR)

              temp_BN = BASE_BN
              temp_TR = BASE_TRANS
              while True:
                  f_bn=get_font(False, temp_BN)
                  f_tr=get_font(False, temp_TR)
                  trans_lines = [item.get('transliteration','').strip()] # simple
                  bn_lines = [item.get('bengali','').strip()]
                  # wrap
                  def simple_wrap(txt, font):
                      lines=[]; cur=""
                      for w in txt.split():
                          test=f"{cur} {w}".strip()
                          if draw.textlength(test, font=font) <= max_w:
                              cur=test
                          else:
                              if cur: lines.append(cur)
                              cur=w
                      if cur: lines.append(cur)
                      return lines
                  trans_lines = simple_wrap(item.get('transliteration',''), f_tr)
                  bn_lines = simple_wrap(item.get('bengali',''), f_bn)
                  needed = ar_block_h + len(trans_lines)*int(temp_TR*SCALE*1.5) + len(bn_lines)*int(temp_BN*SCALE*1.4) + 300
                  if needed < H - TOP_MARGIN - BOTTOM_MARGIN or temp_BN <= 28:
                      break
                  temp_BN-=1; temp_TR-=1

              f_bn=get_font(False, temp_BN)
              f_tr=get_font(False, temp_TR)

              start_y = max(TOP_MARGIN, (H - (ar_block_h + len(trans_lines)*int(temp_TR*SCALE*1.5) + len(bn_lines)*int(temp_BN*SCALE*1.4) + 200)//2))
              y=start_y
              for line in arabic_lines:
                  w=draw.textlength(line, font=f_ar)
                  draw.text((W-int(70*SCALE)-w, y), line, font=f_ar, fill=(0,0,0))
                  y+=int(BASE_AR_CURR*SCALE*1.5)
              y+=int(50*SCALE)
              for line in trans_lines:
                  draw.text((LEFT_W+int(50*SCALE), y), line, font=f_tr, fill=(60,60,60))
                  y+=int(temp_TR*SCALE*1.5)
              y+=int(40*SCALE)
              # FIX: এখানে শুধু বঙ্গানুবাদ:
              draw.text((LEFT_W+int(50*SCALE), y), "বঙ্গানুবাদ:", font=get_font(False, 40), fill=(20,40,120))
              y+=int(75*SCALE)
              for line in bn_lines:
                  draw.text((LEFT_W+int(50*SCALE), y), line, font=f_bn, fill=(15,25,85))
                  y+=int(temp_BN*SCALE*1.4)

              bg.save(os.path.join(OUT, filename), "JPEG", quality=95, subsampling=0)

          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: salawat-images
          path: output/
          retention-days: 7

      - name: Push output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/
          git commit -m "fix: handle ﷺ glyph + fix bottom cut + label change" || echo "no changes"
          git push
