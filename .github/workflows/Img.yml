name: Generate Salawat Images

on:
  workflow_dispatch:
    inputs:
      arabic_name:
        description: 'পারার নাম (যেমন: পারা : ০১)'
        required: true
        type: string
      bangla_name:
        description: 'পৃষ্ঠার নাম (যেমন: পৃষ্ঠা : ০১)'
        required: true
        type: string
      subtitle_text:
        description: 'সাবটাইটেল'
        required: false
        default: 'প্রিয় নবী ﷺ''র নূর ও প্রকাশ প্রসঙ্গে'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install Pillow

      - name: Generate Salawat Images
        env:
          ARABIC_NAME: ${{ inputs.arabic_name }}
          BANGLA_NAME: ${{ inputs.bangla_name }}
          SUBTITLE_TEXT: ${{ inputs.subtitle_text }}
        run: |
          python3 << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          import json, os, shutil, urllib.request

          BG="src/background.jpg"
          LOGO="src/logo.jpg"
          DATA="src/data.json"
          OUT="output"
          FONT_BN="src/solaimanlipi.ttf"
          FONT_AR="src/noorehuda.ttf"
          FONT_SA="src/amiri.ttf" # ﷺ এর জন্য

          # ﷺ এর জন্য ফন্ট ডাউনলোড - এই ফন্টে ﷺ আছে
          if not os.path.exists(FONT_SA):
              try:
                  print("Downloading Amiri font for ﷺ...")
                  os.makedirs("src", exist_ok=True)
                  urllib.request.urlretrieve("https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Regular.ttf", FONT_SA)
              except Exception as e:
                  print(f"Amiri download failed: {e}, will use {FONT_AR}")
                  FONT_SA = FONT_AR

          def normalize_ar(text):
              return text.replace('\u0671', '\u0627')

          PARA_RAW=os.environ.get("ARABIC_NAME","").strip()
          PAGE_RAW=os.environ.get("BANGLA_NAME","").strip()
          SUB_RAW=os.environ.get("SUBTITLE_TEXT","").strip() or "প্রিয় নবী ﷺ'র নূর ও প্রকাশ প্রসঙ্গে"

          if os.path.exists(OUT):
              shutil.rmtree(OUT)
          os.makedirs(OUT, exist_ok=True)

          EN_TO_BN=str.maketrans("0123456789","০১২৩৪৫৬৭৮৯")
          def to_bn(s): return str(s).translate(EN_TO_BN)

          W,H=3840,2160
          bg_img=Image.open(BG).convert("RGB") if os.path.exists(BG) else Image.new("RGB",(W,H),(232,236,244))
          W,H=bg_img.size
          LEFT_W=int(W*0.22)
          SCALE=W/1280

          def font(path, dp):
              try: return ImageFont.truetype(path, int(dp*SCALE))
              except: return ImageFont.load_default()

          def draw_mixed(draw_obj, x, y, text, fn_bn, fn_sa, fill):
              """বাংলা শব্দ আস্ত রেখে শুধু ﷺ টা আলাদা ফন্টে আঁকবে"""
              parts = text.split('ﷺ')
              cur_x = x
              for i, part in enumerate(parts):
                  if part:
                      draw_obj.text((cur_x, y), part, font=fn_bn, fill=fill)
                      cur_x += draw_obj.textlength(part, font=fn_bn)
                  if i < len(parts)-1:
                      draw_obj.text((cur_x, y), 'ﷺ', font=fn_sa, fill=fill)
                      cur_x += draw_obj.textlength('ﷺ', font=fn_sa)
              return cur_x

          def length_mixed(text, fn_bn, fn_sa, draw_obj):
              parts = text.split('ﷺ')
              w=0
              for i, part in enumerate(parts):
                  if part: w+=draw_obj.textlength(part, font=fn_bn)
                  if i < len(parts)-1: w+=draw_obj.textlength('ﷺ', font=fn_sa)
              return w

          def wrap_mixed(text, fn_bn, fn_sa, max_w, draw_obj):
              lines=[]; cur=""
              for w in text.split():
                  test=f"{cur} {w}".strip()
                  if length_mixed(test, fn_bn, fn_sa, draw_obj) <= max_w:
                      cur=test
                  else:
                      if cur: lines.append(cur)
                      cur=w
              if cur: lines.append(cur)
              return lines

          def wrap_simple(text, fn, max_w, draw_obj):
              lines=[]; cur=""
              for w in text.split():
                  test=f"{cur} {w}".strip()
                  if draw_obj.textlength(test, font=fn) <= max_w:
                      cur=test
                  else:
                      if cur: lines.append(cur)
                      cur=w
              if cur: lines.append(cur)
              return lines

          with open(DATA, encoding="utf-8") as f:
              data=json.load(f)

          for item in data:
              id_int=int(item.get('id',0))
              filename=f"{id_int:04d}.jpg"
              id_bn=to_bn(str(id_int))

              bg=bg_img.resize((W,H), Image.LANCZOS)
              draw=ImageDraw.Draw(bg)
              draw.rectangle([0,0,LEFT_W,H], fill=(214,218,228))

              if os.path.exists(LOGO):
                  try:
                      ls=int(200*SCALE)
                      logo=Image.open(LOGO).convert("RGBA").resize((ls,ls), Image.LANCZOS)
                      bg.paste(logo,(int((LEFT_W-ls)//2), int(30*SCALE)), logo)
                  except: pass

              f_title_bn=font(FONT_BN, 34)
              f_title_sa=font(FONT_SA, 34)
              f_sub_bn=font(FONT_BN, 26)
              f_sub_sa=font(FONT_SA, 26)
              f_para_bn=font(FONT_BN, 44)
              f_para_sa=font(FONT_SA, 44)
              f_page_bn=font(FONT_BN, 44)
              f_page_sa=font(FONT_SA, 44)
              f_num=font(FONT_BN, 42)
              f_ar=font(FONT_AR, 78)
              f_tr=font(FONT_BN, 40)
              f_bn=font(FONT_BN, 46)
              f_label=font(FONT_BN, 36)

              max_left=LEFT_W-int(40*SCALE)
              max_right=W-LEFT_W-int(140*SCALE)

              y=int(260*SCALE)
              title="মাজমূ’আহ্ সালাওয়াতির রসূল ﷺ"
              for line in wrap_mixed(title, f_title_bn, f_title_sa, max_left, draw):
                  w=length_mixed(line, f_title_bn, f_title_sa, draw)
                  sx=(LEFT_W-w)//2
                  draw_mixed(draw, sx, y, line, f_title_bn, f_title_sa, (15,25,85))
                  y+=int(34*SCALE*1.5)
              y+=int(6*SCALE)
              for line in wrap_mixed(SUB_RAW, f_sub_bn, f_sub_sa, max_left, draw):
                  w=length_mixed(line, f_sub_bn, f_sub_sa, draw)
                  sx=(LEFT_W-w)//2
                  draw_mixed(draw, sx, y, line, f_sub_bn, f_sub_sa, (60,60,80))
                  y+=int(26*SCALE*1.45)

              y+=int(16*SCALE)
              draw.line([(int(40*SCALE), y), (LEFT_W-int(40*SCALE), y)], fill=(100,100,120), width=2)

              # পারা + পৃষ্ঠা - এখন দুটোই দেখা যাবে, ﷺ সহ
              para_y = H - int(200*SCALE)
              page_y = H - int(110*SCALE)

              pw=length_mixed(PARA_RAW, f_para_bn, f_para_sa, draw)
              draw_mixed(draw, (LEFT_W-pw)//2, para_y, PARA_RAW, f_para_bn, f_para_sa, (20,20,60))

              pgw=length_mixed(PAGE_RAW, f_page_bn, f_page_sa, draw)
              draw_mixed(draw, (LEFT_W-pgw)//2, page_y, PAGE_RAW, f_page_bn, f_page_sa, (20,20,60))

              # ID Circle
              dia=int(110*SCALE)
              cx=W-dia-int(50*SCALE)
              cy=int(50*SCALE)
              draw.ellipse([(cx,cy),(cx+dia,cy+dia)], fill=(35,45,85))
              nw=draw.textlength(id_bn, font=f_num)
              draw.text((cx+(dia-nw)//2, cy+(dia-int(42*SCALE))//2), id_bn, font=f_num, fill=(255,255,255))

              # ডান পাশ
              ar_lines=wrap_simple(normalize_ar(item.get('arabic','')), f_ar, max_right, draw)
              tr_lines=wrap_simple(item.get('transliteration',''), f_tr, max_right, draw)
              bn_lines=wrap_simple(item.get('bengali',''), f_bn, max_right, draw)

              total=len(ar_lines)*int(78*SCALE*1.5)+len(tr_lines)*int(40*SCALE*1.5)+len(bn_lines)*int(46*SCALE*1.4)+250
              sy=max(int(140*SCALE), (H-total)//2)
              yy=sy
              for line in ar_lines:
                  ww=draw.textlength(line, font=f_ar)
                  draw.text((W-int(70*SCALE)-ww, yy), line, font=f_ar, fill=(0,0,0))
                  yy+=int(78*SCALE*1.5)
              yy+=int(35*SCALE)
              for line in tr_lines:
                  draw.text((LEFT_W+int(50*SCALE), yy), line, font=f_tr, fill=(60,60,60))
                  yy+=int(40*SCALE*1.5)
              yy+=int(25*SCALE)
              draw.text((LEFT_W+int(50*SCALE), yy), "বঙ্গানুবাদ:", font=f_label, fill=(20,40,120))
              yy+=int(60*SCALE)
              for line in bn_lines:
                  draw.text((LEFT_W+int(50*SCALE), yy), line, font=f_bn, fill=(15,25,85))
                  yy+=int(46*SCALE*1.4)

              bg.save(os.path.join(OUT, filename), "JPEG", quality=95, subsampling=0)
              print(f"Done {filename}")

          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: salawat-images
          path: output/
          retention-days: 7

      - name: Push output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/
          git commit -m "fix: para visible + ﷺ with amiri font" || echo "no changes"
          git push
