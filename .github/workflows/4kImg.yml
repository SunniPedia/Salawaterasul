name: Generate Salawat Images

on:
  workflow_dispatch:
    inputs:
      para_name:
        description: 'পারার নাম (যেমন: পারা : ০১)'
        required: true
        default: 'পারা : ০১'
        type: string
      page_name:
        description: 'পৃষ্ঠার নাম (যেমন: পৃষ্ঠা : ০১)'
        required: true
        default: 'পৃষ্ঠা : ০১'
        type: string
      subtitle_text:
        description: 'সাবটাইটেল'
        required: false
        default: 'প্রিয় নবী ﷺ''র নূর ও প্রকাশ প্রসঙ্গে'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install Pillow fonttools

      - name: Generate Salawat Images
        env:
          PARA_NAME: ${{ inputs.para_name }}
          PAGE_NAME: ${{ inputs.page_name }}
          SUBTITLE_TEXT: ${{ inputs.subtitle_text }}
        run: |
          python3 << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          from fontTools.ttLib import TTFont
          import json, os, shutil, urllib.request

          BG="src/background.jpg"
          LOGO="src/logo.jpg"
          DATA="src/data.json"
          OUT="output"
          FONT_BN="src/solaimanlipi.ttf"
          FONT_AR="src/noorehuda.ttf"
          FONT_SA="src/amiri.ttf" # ﷺ এর জন্য

          SALLALLAHU_CP = 0xFDFA  # ﷺ এর codepoint

          def has_glyph(font_path, codepoint):
              """ফন্টে আসলেই এই glyph আছে কিনা যাচাই করে (শুধু file exists চেক না)"""
              try:
                  tt = TTFont(font_path)
                  cmap = tt.getBestCmap()
                  return cmap is not None and codepoint in cmap
              except Exception as e:
                  print(f"  glyph-check ব্যর্থ ({font_path}): {e}")
                  return False

          # ধাপ ১: প্রথমে দেখি FONT_AR (noorehuda) নিজেই ﷺ সাপোর্ট করে কিনা - করলে আলাদা ফন্ট ডাউনলোডের দরকার নেই
          if os.path.exists(FONT_AR) and has_glyph(FONT_AR, SALLALLAHU_CP):
              print(f"{FONT_AR}-এ ﷺ glyph পাওয়া গেছে, সেটাই ব্যবহার হবে।")
              FONT_SA = FONT_AR
          else:
              # ধাপ ২: amiri.ttf আগে থেকে থাকলেও glyph যাচাই করে নেই (আগের রানে corrupted download থাকতে পারে)
              need_download = True
              if os.path.exists(FONT_SA):
                  if has_glyph(FONT_SA, SALLALLAHU_CP):
                      print(f"{FONT_SA} আগে থেকেই আছে এবং ﷺ glyph valid।")
                      need_download = False
                  else:
                      print(f"{FONT_SA} আছে কিন্তু ﷺ glyph নেই/ভাঙা, নতুন করে ডাউনলোড হবে।")
                      os.remove(FONT_SA)

              if need_download:
                  os.makedirs("src", exist_ok=True)
                  try:
                      print("Amiri font ডাউনলোড হচ্ছে (ﷺ সাপোর্টের জন্য)...")
                      urllib.request.urlretrieve(
                          "https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Regular.ttf",
                          FONT_SA
                      )
                      if not has_glyph(FONT_SA, SALLALLAHU_CP):
                          raise RuntimeError("ডাউনলোড হওয়া ফন্টেও ﷺ glyph পাওয়া যায়নি।")
                      print("Amiri font ডাউনলোড সফল, ﷺ glyph নিশ্চিত হয়েছে।")
                  except Exception as e:
                      print(f"⚠️  Amiri download/verify ব্যর্থ: {e}")
                      print(f"⚠️  ﷺ চিহ্নটি এই রানে সঠিকভাবে নাও দেখাতে পারে — {FONT_AR} দিয়ে fallback করা হচ্ছে।")
                      FONT_SA = FONT_AR

          def normalize_ar(text):
              return text.replace('\u0671', '\u0627')

          PARA_RAW=os.environ.get("PARA_NAME","").strip()
          PAGE_RAW=os.environ.get("PAGE_NAME","").strip()
          SUB_RAW=os.environ.get("SUBTITLE_TEXT","").strip() or "প্রিয় নবী ﷺ'র নূর ও প্রকাশ প্রসঙ্গে"

          # ডিবাগ: inputs আসলে কী এসেছে তা log-এ দেখাই, যাতে খালি থাকলে সাথে সাথে বোঝা যায়
          print(f"[DEBUG] PARA_RAW = '{PARA_RAW}'")
          print(f"[DEBUG] PAGE_RAW = '{PAGE_RAW}'")
          print(f"[DEBUG] SUB_RAW  = '{SUB_RAW}'")

          if not PARA_RAW:
              print("[WARNING] পারার নাম খালি এসেছে! Workflow trigger করার সময় 'para_name' ফিল্ডে মান দিন।")
              PARA_RAW = "পারা : ০১"
          if not PAGE_RAW:
              print("[WARNING] পৃষ্ঠার নাম খালি এসেছে! Workflow trigger করার সময় 'page_name' ফিল্ডে মান দিন।")
              PAGE_RAW = "পৃষ্ঠা : ০১"

          if os.path.exists(OUT):
              shutil.rmtree(OUT)
          os.makedirs(OUT, exist_ok=True)

          EN_TO_BN=str.maketrans("0123456789","০১২৩৪৫৬৭৮৯")
          def to_bn(s): return str(s).translate(EN_TO_BN)

          # ---- সব ছবির width সবসময় এই মান-ই থাকবে, ফিক্সড ----
          TARGET_W = 3840

          # ---- background.jpg লোড করে TARGET_W width-এ normalize করি ----
          # (source background.jpg-এর আসল সাইজ যাই হোক না কেন - ৩৮৪০ না হলেও - আমরা
          #  নিজের aspect ratio ঠিক রেখেই width কে 3840-এ নামিয়ে/বাড়িয়ে আনছি, যাতে
          #  output-এ width বরাবর 3840-ই থাকে এবং background নিজে distort না হয়)
          if os.path.exists(BG):
              _bg_raw = Image.open(BG).convert("RGB")
          else:
              _bg_raw = Image.new("RGB", (TARGET_W, 2160), (232,236,244))

          if _bg_raw.width != TARGET_W:
              _resize_ratio = TARGET_W / _bg_raw.width
              _new_h = round(_bg_raw.height * _resize_ratio)
              orig_bg = _bg_raw.resize((TARGET_W, _new_h), Image.LANCZOS)
              print(f"[INFO] background.jpg width {_bg_raw.width} → {TARGET_W}-এ normalize করা হলো (height {_bg_raw.height} → {_new_h})")
          else:
              orig_bg = _bg_raw

          W = TARGET_W
          BASE_W, BASE_H = orig_bg.size   # BASE_H = normalize করার পরের স্বাভাবিক height
          LEFT_W = int(W*0.22)
          SCALE = W/1280

          def font(path, dp):
              try: return ImageFont.truetype(path, int(dp*SCALE))
              except: return ImageFont.load_default()

          def draw_mixed(draw_obj, x, y, text, fn_bn, fn_sa, fill):
              """বাংলা/আরবি টেক্সট আস্ত রেখে শুধু ﷺ টা আলাদা (glyph-verified) ফন্টে আঁকবে"""
              parts = text.split('ﷺ')
              cur_x = x
              for i, part in enumerate(parts):
                  if part:
                      draw_obj.text((cur_x, y), part, font=fn_bn, fill=fill)
                      cur_x += draw_obj.textlength(part, font=fn_bn)
                  if i < len(parts)-1:
                      draw_obj.text((cur_x, y), 'ﷺ', font=fn_sa, fill=fill)
                      cur_x += draw_obj.textlength('ﷺ', font=fn_sa)
              return cur_x

          def length_mixed(text, fn_bn, fn_sa, draw_obj):
              parts = text.split('ﷺ')
              w=0
              for i, part in enumerate(parts):
                  if part: w+=draw_obj.textlength(part, font=fn_bn)
                  if i < len(parts)-1: w+=draw_obj.textlength('ﷺ', font=fn_sa)
              return w

          def wrap_mixed(text, fn_bn, fn_sa, max_w, draw_obj):
              lines=[]; cur=""
              for w in text.split():
                  test=f"{cur} {w}".strip()
                  if length_mixed(test, fn_bn, fn_sa, draw_obj) <= max_w:
                      cur=test
                  else:
                      if cur: lines.append(cur)
                      cur=w
              if cur: lines.append(cur)
              return lines

          def make_canvas(target_h):
              """background কে stretch না করে (width অপরিবর্তিত থাকে), প্রয়োজনে নিচের
                 দিকে extend করে target_h উচ্চতার canvas বানায়। মূল অংশ অপরিবর্তিত থাকে,
                 শুধু বাড়তি জায়গাটা bottom edge-এর strip স্ট্রেচ করে ভরাট হয়।"""
              if target_h <= BASE_H:
                  return orig_bg.copy()

              canvas = Image.new("RGB", (W, target_h), (232,236,244))
              canvas.paste(orig_bg, (0,0))

              # bottom edge-এর একটা পাতলা strip রিসাইজ করে বাকি অংশে বসিয়ে দিচ্ছি,
              # যাতে হুট করে একরঙা ফাঁকা জায়গা না দেখায়
              strip = orig_bg.crop((0, BASE_H-10, W, BASE_H))
              extend_h = target_h - BASE_H
              stretched_strip = strip.resize((W, extend_h), Image.LANCZOS)
              canvas.paste(stretched_strip, (0, BASE_H))
              return canvas

          # ---- measurement এর জন্য dummy draw object (কোনো ছবি ছাড়াই টেক্সট সাইজ মাপার কাজে ব্যবহার হয়) ----
          dummy_img = Image.new("RGB", (10, 10))
          dummy_draw = ImageDraw.Draw(dummy_img)

          with open(DATA, encoding="utf-8") as f:
              data=json.load(f)

          for item in data:
              id_int=int(item.get('id',0))
              filename=f"{id_int:04d}.jpg"
              id_bn=to_bn(str(id_int))

              max_left=LEFT_W-int(40*SCALE)
              max_right=W-LEFT_W-int(140*SCALE)

              # ফন্টগুলো লোড করি
              f_title_bn=font(FONT_BN, 34)
              f_title_sa=font(FONT_SA, 34)
              f_sub_bn=font(FONT_BN, 26)
              f_sub_sa=font(FONT_SA, 26)
              f_para_bn=font(FONT_BN, 44)
              f_para_sa=font(FONT_SA, 44)
              f_page_bn=font(FONT_BN, 44)
              f_page_sa=font(FONT_SA, 44)
              f_num=font(FONT_BN, 42)
              f_ar=font(FONT_AR, 78)
              f_ar_sa=font(FONT_SA, 78)
              f_tr=font(FONT_BN, 40)
              f_tr_sa=font(FONT_SA, 40)
              f_bn=font(FONT_BN, 46)
              f_bn_sa=font(FONT_SA, 46)
              f_label=font(FONT_BN, 36)

              # ডান পাশের কনটেন্ট
              arabic_txt = normalize_ar(item.get('arabic',''))
              tr_txt = item.get('transliteration','')
              bn_txt = item.get('bengali','')

              ar_lines=wrap_mixed(arabic_txt, f_ar, f_ar_sa, max_right, dummy_draw)
              tr_lines=wrap_mixed(tr_txt, f_tr, f_tr_sa, max_right, dummy_draw)
              bn_lines=wrap_mixed(bn_txt, f_bn, f_bn_sa, max_right, dummy_draw)

              total=len(ar_lines)*int(78*SCALE*1.5)+len(tr_lines)*int(40*SCALE*1.5)+len(bn_lines)*int(46*SCALE*1.4)+250

              # ---- width সবসময় TARGET_W (3840)-ই থাকে, শুধু height প্রয়োজনমতো বাড়ে ----
              TOP_MARGIN=int(140*SCALE)
              BOTTOM_MARGIN=int(140*SCALE)
              required_H = total + TOP_MARGIN + BOTTOM_MARGIN
              H = max(BASE_H, required_H)

              bg = make_canvas(H)
              draw=ImageDraw.Draw(bg)
              draw.rectangle([0,0,LEFT_W,H], fill=(214,218,228))

              if os.path.exists(LOGO):
                  try:
                      ls=int(200*SCALE)
                      logo=Image.open(LOGO).convert("RGBA").resize((ls,ls), Image.LANCZOS)
                      bg.paste(logo,(int((LEFT_W-ls)//2), int(30*SCALE)), logo)
                  except: pass

              y=int(260*SCALE)
              title="মাজমূ'আহ্ সালাওয়াতির রসূল ﷺ"
              for line in wrap_mixed(title, f_title_bn, f_title_sa, max_left, draw):
                  w=length_mixed(line, f_title_bn, f_title_sa, draw)
                  sx=(LEFT_W-w)//2
                  draw_mixed(draw, sx, y, line, f_title_bn, f_title_sa, (15,25,85))
                  y+=int(34*SCALE*1.5)
              y+=int(6*SCALE)
              for line in wrap_mixed(SUB_RAW, f_sub_bn, f_sub_sa, max_left, draw):
                  w=length_mixed(line, f_sub_bn, f_sub_sa, draw)
                  sx=(LEFT_W-w)//2
                  draw_mixed(draw, sx, y, line, f_sub_bn, f_sub_sa, (60,60,80))
                  y+=int(26*SCALE*1.45)

              y+=int(16*SCALE)
              draw.line([(int(40*SCALE), y), (LEFT_W-int(40*SCALE), y)], fill=(100,100,120), width=2)

              # পারা + পৃষ্ঠা - ﷺ সহ, mixed-font রেন্ডারিং দিয়ে
              para_y = H - int(200*SCALE)
              page_y = H - int(110*SCALE)

              pw=length_mixed(PARA_RAW, f_para_bn, f_para_sa, draw)
              draw_mixed(draw, (LEFT_W-pw)//2, para_y, PARA_RAW, f_para_bn, f_para_sa, (20,20,60))

              pgw=length_mixed(PAGE_RAW, f_page_bn, f_page_sa, draw)
              draw_mixed(draw, (LEFT_W-pgw)//2, page_y, PAGE_RAW, f_page_bn, f_page_sa, (20,20,60))

              # ID Circle
              dia=int(110*SCALE)
              cx=W-dia-int(50*SCALE)
              cy=int(50*SCALE)
              draw.ellipse([(cx,cy),(cx+dia,cy+dia)], fill=(35,45,85))
              nw=draw.textlength(id_bn, font=f_num)
              draw.text((cx+(dia-nw)//2, cy+(dia-int(42*SCALE))//2), id_bn, font=f_num, fill=(255,255,255))

              # ডান পাশ - ﷺ mixed-font রেন্ডারিং সহ আরবি/উচ্চারণ/বাংলা লেখা
              sy=max(TOP_MARGIN, (H-total)//2)
              yy=sy
              for line in ar_lines:
                  ww=length_mixed(line, f_ar, f_ar_sa, draw)
                  draw_mixed(draw, W-int(70*SCALE)-ww, yy, line, f_ar, f_ar_sa, (0,0,0))
                  yy+=int(78*SCALE*1.5)
              yy+=int(35*SCALE)
              for line in tr_lines:
                  draw_mixed(draw, LEFT_W+int(50*SCALE), yy, line, f_tr, f_tr_sa, (60,60,60))
                  yy+=int(40*SCALE*1.5)
              yy+=int(25*SCALE)
              draw.text((LEFT_W+int(50*SCALE), yy), "বঙ্গানুবাদ:", font=f_label, fill=(20,40,120))
              yy+=int(60*SCALE)
              for line in bn_lines:
                  draw_mixed(draw, LEFT_W+int(50*SCALE), yy, line, f_bn, f_bn_sa, (15,25,85))
                  yy+=int(46*SCALE*1.4)

              bg.save(os.path.join(OUT, filename), "JPEG", quality=95, subsampling=0)
              print(f"Done {filename} | W={W} H={H} (BASE_H={BASE_H})")

          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: salawat-images
          path: output/
          retention-days: 7

      - name: Push output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/
          git commit -m "fix: width always locked to 3840, only height grows for long text" || echo "no changes"
          git push
