name: Generate 4K Video from Images and Audio

on:
  workflow_dispatch: {}   # Manually run from the Actions tab
  # push:
  #   branches: [ main ]  # চাইলে push হলে অটো রান করতে চাইলে এটা আনকমেন্ট করো

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # GitHub free runner ম্যাক্স ৬ ঘন্টা (৩৬০ মিনিট), সেফ মার্জিন রাখা হলো

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true   # যদি Git LFS ব্যবহার করো, সেটাও পুল করবে

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify folders exist
        run: |
          if [ ! -d "output" ]; then
            echo "::error::output ফোল্ডার পাওয়া যায়নি"
            exit 1
          fi
          if [ ! -d "rizwanaudio" ]; then
            echo "::error::rizwanaudio ফোল্ডার পাওয়া যায়নি"
            exit 1
          fi

      - name: Build per-pair video segments
        run: |
          set -e
          mkdir -p segments
          rm -f concat_list.txt

          # rizwanaudio ফোল্ডারের প্রতিটি mp3 ফাইল ধরে ধরে matching jpg খুঁজে সেগমেন্ট বানাবে
          for audio in rizwanaudio/*.mp3; do
            filename=$(basename "$audio" .mp3)
            image="output/${filename}.jpg"

            if [ ! -f "$image" ]; then
              echo "::warning::${filename}.jpg পাওয়া যায়নি, এই পেয়ারটি স্কিপ করা হলো"
              continue
            fi

            echo ">>> Processing pair: ${filename}.jpg + ${filename}.mp3"

            # অডিওর দৈর্ঘ্য বের করা হচ্ছে যাতে ভিডিও ঠিক ততক্ষণ চলে
            duration=$(ffprobe -v error -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 "$audio")

            ffmpeg -y -loop 1 -i "$image" -i "$audio" \
              -c:v libx264 -preset medium -crf 18 -tune stillimage \
              -c:a aac -b:a 192k -pix_fmt yuv420p \
              -vf "scale=3840:2160:force_original_aspect_ratio=decrease,pad=3840:2160:(ow-iw)/2:(oh-ih)/2:color=black,setsar=1,fps=30" \
              -shortest -t "$duration" \
              "segments/${filename}.mp4"

            echo "file '$(pwd)/segments/${filename}.mp4'" >> concat_list.txt
          done

          echo "----- concat_list.txt -----"
          cat concat_list.txt

      - name: Concatenate all segments into final 4K video
        run: |
          set -e
          if [ ! -s concat_list.txt ]; then
            echo "::error::কোনো ভ্যালিড পেয়ার পাওয়া যায়নি, ভিডিও তৈরি করা যাচ্ছে না"
            exit 1
          fi

          ffmpeg -y -f concat -safe 0 -i concat_list.txt -c copy final_4k_video.mp4

          echo "ফাইনাল ভিডিও রেডি:"
          ls -lh final_4k_video.mp4

      - name: Upload video as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-4k-video
          path: final_4k_video.mp4
          retention-days: 7   # প্রয়োজনমতো দিন বাড়াতে/কমাতে পারো

      - name: Create GitHub Release with the video (optional, for permanent storage)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_number }}
          name: 4K Video Build #${{ github.run_number }}
          files: final_4k_video.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
