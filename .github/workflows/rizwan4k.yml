name: Generate 4K Video from Images and Audio

on:
  workflow_dispatch: {}   # Manually run from the Actions tab

  # push:
  #   branches: [ main ]  # চাইলে push হলে অটো রান করতে এটা আনকমেন্ট করো


jobs:
  build-video:
    runs-on: ubuntu-latest

    timeout-minutes: 340
    # GitHub free runner-এর জন্য নিরাপদ timeout


    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          # Git LFS ব্যবহার করলে সেটাও pull করবে


      # ============================================================
      # 2. Install FFmpeg
      # ============================================================
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ============================================================
      # 3. Verify folders exist
      # ============================================================
      - name: Verify folders exist
        run: |
          set -e

          if [ ! -d "output" ]; then
            echo "::error::output ফোল্ডার পাওয়া যায়নি"
            exit 1
          fi

          if [ ! -d "rizwanaudio" ]; then
            echo "::error::rizwanaudio ফোল্ডার পাওয়া যায়নি"
            exit 1
          fi

          echo "✓ output folder পাওয়া গেছে"
          echo "✓ rizwanaudio folder পাওয়া গেছে"


      # ============================================================
      # 4. Detect Maximum Image Height
      #
      # Width সবসময় 3840 হতে হবে।
      #
      # Height dynamic।
      #
      # এখানে সব matching JPG-এর মধ্যে সর্বোচ্চ Height বের করা হবে।
      #
      # উদাহরণ:
      #
      # 0001.jpg = 3840x2160
      # 0002.jpg = 3840x2160
      # 0003.jpg = 3840x2160
      # 0004.jpg = 3840x2731
      #
      # তাহলে:
      #
      # Maximum original height = 2731
      #
      # H.264-এর জন্য এটাকে even করা হবে:
      #
      # Final canvas = 3840x2732
      # ============================================================
      - name: Detect maximum image height
        run: |
          set -e

          MAX_IMAGE_HEIGHT=0
          IMAGE_COUNT=0


          for image in output/*.jpg; do

            if [ ! -f "$image" ]; then
              continue
            fi


            width=$(ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width \
              -of csv=p=0 \
              "$image")


            height=$(ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=height \
              -of csv=p=0 \
              "$image")


            echo "$(basename "$image") → ${width}x${height}"


            # ------------------------------------------------------
            # Width must be 3840
            # ------------------------------------------------------
            if [ "$width" != "3840" ]; then
              echo "::error::$(basename "$image")-এর Width ${width}px। Expected 3840px"
              exit 1
            fi


            # ------------------------------------------------------
            # Maximum height বের করা
            # ------------------------------------------------------
            if [ "$height" -gt "$MAX_IMAGE_HEIGHT" ]; then
              MAX_IMAGE_HEIGHT="$height"
            fi


            IMAGE_COUNT=$((IMAGE_COUNT + 1))

          done


          if [ "$IMAGE_COUNT" -eq 0 ]; then
            echo "::error::output ফোল্ডারে কোনো JPG পাওয়া যায়নি"
            exit 1
          fi


          # --------------------------------------------------------
          # H.264-এর জন্য final height even করতে হবে
          # --------------------------------------------------------
          MAX_VIDEO_HEIGHT=$(( (MAX_IMAGE_HEIGHT + 1) / 2 * 2 ))


          echo ""
          echo "============================================================"
          echo "IMAGE HEIGHT ANALYSIS"
          echo "============================================================"

          echo "Maximum Original Image Height = ${MAX_IMAGE_HEIGHT}px"
          echo "Final Video Canvas Height     = ${MAX_VIDEO_HEIGHT}px"
          echo "Final Video Width              = 3840px"

          echo ""
          echo "✓ Maximum video canvas:"
          echo "  3840x${MAX_VIDEO_HEIGHT}"


          # --------------------------------------------------------
          # পরবর্তী steps-এর জন্য environment variable
          # --------------------------------------------------------
          echo "MAX_IMAGE_HEIGHT=${MAX_IMAGE_HEIGHT}" >> "$GITHUB_ENV"
          echo "MAX_VIDEO_HEIGHT=${MAX_VIDEO_HEIGHT}" >> "$GITHUB_ENV"


      # ============================================================
      # 5. Build Per-Pair Video Segments
      #
      # প্রতিটি JPG-এর original resolution প্রথমে রাখা হবে।
      #
      # তারপর final maximum canvas-এর মধ্যে সেট করা হবে।
      #
      # কোনো stretch/crop হবে না।
      #
      # Image ছোট হলে padding যোগ হবে।
      #
      # Image maximum height-এর সমান হলে padding লাগবে না।
      # ============================================================
      - name: Build per-pair video segments
        run: |
          set -e

          mkdir -p segments

          rm -f concat_list.txt


          # --------------------------------------------------------
          # প্রতিটি MP3
          # --------------------------------------------------------
          for audio in rizwanaudio/*.mp3; do

            if [ ! -f "$audio" ]; then
              echo "::warning::কোনো MP3 ফাইল পাওয়া যায়নি"
              continue
            fi


            filename=$(basename "$audio" .mp3)

            image="output/${filename}.jpg"


            # ------------------------------------------------------
            # Matching JPG
            # ------------------------------------------------------
            if [ ! -f "$image" ]; then
              echo "::warning::${filename}.jpg পাওয়া যায়নি, এই পেয়ারটি স্কিপ করা হলো"
              continue
            fi


            echo ""
            echo "============================================================"
            echo ">>> Processing pair:"
            echo "    Image : ${image}"
            echo "    Audio : ${audio}"
            echo "============================================================"


            # ------------------------------------------------------
            # Original Image Resolution
            # ------------------------------------------------------
            image_width=$(ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width \
              -of csv=p=0 \
              "$image")


            image_height=$(ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=height \
              -of csv=p=0 \
              "$image")


            echo "Original Width  = ${image_width}px"
            echo "Original Height = ${image_height}px"


            # ------------------------------------------------------
            # Width validation
            # ------------------------------------------------------
            if [ "$image_width" != "3840" ]; then
              echo "::error::${filename}.jpg-এর Width ${image_width}px। Expected 3840px"
              exit 1
            fi


            # ------------------------------------------------------
            # Calculate vertical padding
            #
            # Image-এর original height-এর কোনো পরিবর্তন নেই।
            #
            # শুধু maximum canvas পর্যন্ত padding।
            # ------------------------------------------------------
            total_padding=$((MAX_VIDEO_HEIGHT - image_height))


            # ------------------------------------------------------
            # Padding দুই পাশে ভাগ করা হবে।
            #
            # উদাহরণ:
            #
            # Canvas = 2732
            # Image  = 2160
            #
            # Total = 572
            #
            # Top    = 286
            # Bottom = 286
            #
            # যদি odd হয়, extra pixel bottom-এ যাবে।
            # ------------------------------------------------------
            pad_top=$((total_padding / 2))
            pad_bottom=$((total_padding - pad_top))


            echo "Target Canvas    = 3840x${MAX_VIDEO_HEIGHT}"
            echo "Total Padding    = ${total_padding}px"
            echo "Top Padding      = ${pad_top}px"
            echo "Bottom Padding   = ${pad_bottom}px"


            # ------------------------------------------------------
            # Audio Duration
            # ------------------------------------------------------
            duration=$(ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$audio")


            echo "Audio Duration   = ${duration} seconds"


            # ======================================================
            # FFmpeg
            #
            # Image-এর original resolution কোনোভাবেই scale করা হচ্ছে
            # না।
            #
            # pad filter শুধু canvas তৈরি করছে।
            #
            # Width:
            #   3840
            #
            # Height:
            #   MAX_VIDEO_HEIGHT
            #
            # ======================================================

            ffmpeg -y \
              -loop 1 \
              -framerate 30 \
              -i "$image" \
              -i "$audio" \
              \
              -c:v libx264 \
              -preset medium \
              -crf 18 \
              -tune stillimage \
              \
              -c:a aac \
              -b:a 192k \
              \
              -pix_fmt yuv420p \
              \
              -vf "pad=3840:${MAX_VIDEO_HEIGHT}:0:${pad_top}:color=black,setsar=1" \
              \
              -t "$duration" \
              -shortest \
              \
              "segments/${filename}.mp4"


            # ======================================================
            # Segment Verification
            # ======================================================

            segment_width=$(ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width \
              -of csv=p=0 \
              "segments/${filename}.mp4")


            segment_height=$(ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=height \
              -of csv=p=0 \
              "segments/${filename}.mp4")


            echo ""
            echo "Generated Segment:"
            echo "  Width  = ${segment_width}px"
            echo "  Height = ${segment_height}px"


            # ------------------------------------------------------
            # Resolution validation
            # ------------------------------------------------------
            if [ "$segment_width" != "3840" ]; then
              echo "::error::${filename}.mp4 Width ${segment_width}px। Expected 3840px"
              exit 1
            fi


            if [ "$segment_height" != "$MAX_VIDEO_HEIGHT" ]; then
              echo "::error::${filename}.mp4 Height ${segment_height}px। Expected ${MAX_VIDEO_HEIGHT}px"
              exit 1
            fi


            # ------------------------------------------------------
            # Even dimension validation
            # ------------------------------------------------------
            if [ $((segment_width % 2)) -ne 0 ]; then
              echo "::error::Video Width odd হয়েছে"
              exit 1
            fi


            if [ $((segment_height % 2)) -ne 0 ]; then
              echo "::error::Video Height odd হয়েছে"
              exit 1
            fi


            echo "✓ Resolution verified:"
            echo "  ${segment_width}x${segment_height}"


            # ------------------------------------------------------
            # Concat list
            # ------------------------------------------------------
            echo "file '$(pwd)/segments/${filename}.mp4'" >> concat_list.txt


            echo "✓ Done: ${filename}.mp4"

          done


          echo ""
          echo "============================================================"
          echo "----- concat_list.txt -----"
          echo "============================================================"

          cat concat_list.txt


      # ============================================================
      # 6. Verify All Segments Have Same Resolution
      # ============================================================
      - name: Verify segment compatibility
        run: |
          set -e


          if [ ! -s concat_list.txt ]; then
            echo "::error::কোনো valid video segment তৈরি হয়নি"
            exit 1
          fi


          echo ""
          echo "============================================================"
          echo "SEGMENT COMPATIBILITY CHECK"
          echo "============================================================"


          while IFS= read -r line; do

            segment=$(echo "$line" | sed "s/^file '//;s/'$//")


            width=$(ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width \
              -of csv=p=0 \
              "$segment")


            height=$(ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=height \
              -of csv=p=0 \
              "$segment")


            echo "$(basename "$segment") → ${width}x${height}"


            if [ "$width" != "3840" ]; then
              echo "::error::$(basename "$segment") Width mismatch"
              exit 1
            fi


            if [ "$height" != "$MAX_VIDEO_HEIGHT" ]; then
              echo "::error::$(basename "$segment") Height mismatch"
              echo "::error::Expected: 3840x${MAX_VIDEO_HEIGHT}"
              echo "::error::Found: ${width}x${height}"
              exit 1
            fi


          done < concat_list.txt


          echo ""
          echo "✓ ALL SEGMENTS ARE COMPATIBLE"
          echo "✓ Resolution = 3840x${MAX_VIDEO_HEIGHT}"


      # ============================================================
      # 7. Concatenate all segments
      # ============================================================
      - name: Concatenate all segments into final video
        run: |
          set -e


          if [ ! -s concat_list.txt ]; then
            echo "::error::কোনো ভ্যালিড পেয়ার পাওয়া যায়নি"
            exit 1
          fi


          echo ""
          echo "============================================================"
          echo "CONCATENATING VIDEO SEGMENTS"
          echo "============================================================"


          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i concat_list.txt \
            -c copy \
            -movflags +faststart \
            final_4k_video.mp4


          echo ""
          echo "============================================================"
          echo "FINAL VIDEO"
          echo "============================================================"


          ls -lh final_4k_video.mp4


      # ============================================================
      # 8. Final Video Verification
      # ============================================================
      - name: Verify final video
        run: |
          set -e


          final_width=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            final_4k_video.mp4)


          final_height=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            final_4k_video.mp4)


          final_duration=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            final_4k_video.mp4)


          echo ""
          echo "============================================================"
          echo "FINAL VIDEO INFORMATION"
          echo "============================================================"

          echo "Width    = ${final_width}px"
          echo "Height   = ${final_height}px"
          echo "Duration = ${final_duration}s"


          # --------------------------------------------------------
          # Width check
          # --------------------------------------------------------
          if [ "$final_width" != "3840" ]; then
            echo "::error::Final video Width ${final_width}px। Expected 3840px"
            exit 1
          fi


          # --------------------------------------------------------
          # Height check
          # --------------------------------------------------------
          if [ "$final_height" != "$MAX_VIDEO_HEIGHT" ]; then
            echo "::error::Final video Height ${final_height}px। Expected ${MAX_VIDEO_HEIGHT}px"
            exit 1
          fi


          # --------------------------------------------------------
          # Even dimension check
          # --------------------------------------------------------
          if [ $((final_width % 2)) -ne 0 ]; then
            echo "::error::Final Width odd"
            exit 1
          fi


          if [ $((final_height % 2)) -ne 0 ]; then
            echo "::error::Final Height odd"
            exit 1
          fi


          echo ""
          echo "✓ FINAL VIDEO VERIFIED"
          echo "✓ Resolution = ${final_width}x${final_height}"
          echo "✓ Width locked to 3840px"
          echo "✓ Height based on maximum image height"
          echo "✓ No cropping"
          echo "✓ No stretching"
          echo "✓ All dimensions are even"


      # ============================================================
      # 9. Upload video as workflow artifact
      # ============================================================
      - name: Upload video as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-4k-video
          path: final_4k_video.mp4
          retention-days: 7


      # ============================================================
      # 10. Create GitHub Release
      # ============================================================
      - name: Create GitHub Release with the video
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_number }}
          name: 4K Video Build #${{ github.run_number }}
          files: final_4k_video.mp4

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
