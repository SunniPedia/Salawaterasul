name: Generate 4K Video from Images and Audio

on:
  workflow_dispatch: {}   # Manually run from the Actions tab

  # push:
  #   branches: [ main ]  # চাইলে push হলে অটো রান করতে এটা আনকমেন্ট করো


jobs:
  build-video:
    runs-on: ubuntu-latest

    timeout-minutes: 340
    # GitHub free runner-এর জন্য নিরাপদ timeout


    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          # Git LFS ব্যবহার করলে সেটাও pull করবে


      # ============================================================
      # 2. Install FFmpeg
      # ============================================================
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ============================================================
      # 3. Verify folders exist
      # ============================================================
      - name: Verify folders exist
        run: |
          set -e

          if [ ! -d "output" ]; then
            echo "::error::output ফোল্ডার পাওয়া যায়নি"
            exit 1
          fi

          if [ ! -d "rizwanaudio" ]; then
            echo "::error::rizwanaudio ফোল্ডার পাওয়া যায়নি"
            exit 1
          fi

          echo "✓ output folder পাওয়া গেছে"
          echo "✓ rizwanaudio folder পাওয়া গেছে"


      # ============================================================
      # 4. Build per-pair video segments
      #
      # IMAGE RESOLUTION POLICY:
      #
      # Width:
      #   সবসময় 3840 px
      #
      # Height:
      #   Image-এর আসল Height রাখা হবে।
      #
      # কিন্তু H.264-এর জন্য Width/Height অবশ্যই even হতে হবে।
      #
      # তাই:
      #
      # 3840x2160 → 3840x2160
      # 3840x2731 → 3840x2732
      # 3840x2732 → 3840x2732
      # 3840x3001 → 3840x3002
      #
      # Odd Height হলে শুধু নিচে সর্বোচ্চ 1px padding যোগ হবে।
      #
      # কোনো:
      # - crop হবে না
      # - 3840x2160 resize হবে না
      # - aspect ratio পরিবর্তন হবে না
      # - image stretch হবে না
      # ============================================================
      - name: Build per-pair video segments
        run: |
          set -e

          mkdir -p segments

          rm -f concat_list.txt


          # --------------------------------------------------------
          # rizwanaudio ফোল্ডারের প্রতিটি MP3 ফাইল
          # --------------------------------------------------------
          for audio in rizwanaudio/*.mp3; do

            # কোনো MP3 না থাকলে loop pattern literal হতে পারে
            if [ ! -f "$audio" ]; then
              echo "::warning::কোনো MP3 ফাইল পাওয়া যায়নি"
              continue
            fi


            # ------------------------------------------------------
            # Matching filename
            #
            # 0001.mp3
            #     ↓
            # output/0001.jpg
            # ------------------------------------------------------
            filename=$(basename "$audio" .mp3)

            image="output/${filename}.jpg"


            # ------------------------------------------------------
            # Matching JPG আছে কিনা
            # ------------------------------------------------------
            if [ ! -f "$image" ]; then
              echo "::warning::${filename}.jpg পাওয়া যায়নি, এই পেয়ারটি স্কিপ করা হলো"
              continue
            fi


            echo ""
            echo "============================================================"
            echo ">>> Processing pair:"
            echo "    Image : ${image}"
            echo "    Audio : ${audio}"
            echo "============================================================"


            # ------------------------------------------------------
            # Image-এর আসল Width
            # ------------------------------------------------------
            image_width=$(ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width \
              -of csv=p=0 \
              "$image")


            # ------------------------------------------------------
            # Image-এর আসল Height
            # ------------------------------------------------------
            image_height=$(ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=height \
              -of csv=p=0 \
              "$image")


            echo "Original Image Width  = ${image_width}px"
            echo "Original Image Height = ${image_height}px"


            # ------------------------------------------------------
            # Width validation
            #
            # আগের Image Generator YML অনুযায়ী:
            # TARGET_W = 3840
            # ------------------------------------------------------
            if [ "$image_width" != "3840" ]; then
              echo "::error::${filename}.jpg-এর Width ${image_width}px। Expected Width = 3840px"
              exit 1
            fi


            # ------------------------------------------------------
            # Height validation
            # ------------------------------------------------------
            if [ "$image_height" -le 0 ]; then
              echo "::error::${filename}.jpg-এর Height invalid"
              exit 1
            fi


            # ------------------------------------------------------
            # H.264-এর জন্য Height even হতে হবে
            #
            # যদি:
            # 2731 → 2732
            #
            # যদি:
            # 2732 → 2732
            #
            # যদি:
            # 3001 → 3002
            #
            # অর্থাৎ সর্বোচ্চ 1px padding।
            # ------------------------------------------------------
            video_height=$(( (image_height + 1) / 2 * 2 ))


            # কত pixel padding লাগছে
            padding_height=$(( video_height - image_height ))


            echo "Video Width         = ${image_width}px"
            echo "Video Height        = ${video_height}px"
            echo "Bottom Padding      = ${padding_height}px"


            # ------------------------------------------------------
            # Audio duration
            # ------------------------------------------------------
            duration=$(ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$audio")


            echo "Audio Duration      = ${duration} seconds"


            # ======================================================
            # FFmpeg Video Creation
            #
            # IMPORTANT:
            #
            # Image-এর Width 3840-ই থাকবে।
            #
            # Image-এর original Height রাখা হবে।
            #
            # Odd Height হলে শুধুমাত্র 1px পর্যন্ত bottom padding।
            #
            # কোনো crop নেই।
            # কোনো 3840x2160 forced resize নেই।
            # ======================================================

            if [ "$padding_height" -eq 0 ]; then

              # ----------------------------------------------------
              # Height already even
              # তাই কোনো padding দরকার নেই
              # ----------------------------------------------------
              echo "✓ Height already even. No padding required."


              ffmpeg -y \
                -loop 1 \
                -framerate 30 \
                -i "$image" \
                -i "$audio" \
                \
                -c:v libx264 \
                -preset medium \
                -crf 18 \
                -tune stillimage \
                \
                -c:a aac \
                -b:a 192k \
                \
                -pix_fmt yuv420p \
                \
                -vf "setsar=1" \
                \
                -t "$duration" \
                -shortest \
                \
                "segments/${filename}.mp4"


            else

              # ----------------------------------------------------
              # Height odd
              #
              # Bottom-এ 1px পর্যন্ত padding যোগ হবে।
              #
              # Example:
              #
              # 3840x2731
              #       ↓
              # 3840x2732
              #
              # Original image-এর কোনো অংশ crop হবে না।
              # ----------------------------------------------------
              echo "⚠️ Height is odd."
              echo "✓ Adding ${padding_height}px bottom padding."


              ffmpeg -y \
                -loop 1 \
                -framerate 30 \
                -i "$image" \
                -i "$audio" \
                \
                -c:v libx264 \
                -preset medium \
                -crf 18 \
                -tune stillimage \
                \
                -c:a aac \
                -b:a 192k \
                \
                -pix_fmt yuv420p \
                \
                -vf "pad=iw:${video_height}:0:0:color=black,setsar=1" \
                \
                -t "$duration" \
                -shortest \
                \
                "segments/${filename}.mp4"

            fi


            # ======================================================
            # Generated Segment Verification
            # ======================================================

            segment_width=$(ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width \
              -of csv=p=0 \
              "segments/${filename}.mp4")


            segment_height=$(ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=height \
              -of csv=p=0 \
              "segments/${filename}.mp4")


            echo ""
            echo "Generated Segment:"
            echo "  Width  = ${segment_width}px"
            echo "  Height = ${segment_height}px"


            # ------------------------------------------------------
            # Width verification
            # ------------------------------------------------------
            if [ "$segment_width" != "3840" ]; then
              echo "::error::Video Width ${segment_width}px। Expected 3840px"
              exit 1
            fi


            # ------------------------------------------------------
            # Height verification
            # ------------------------------------------------------
            if [ "$segment_height" != "$video_height" ]; then
              echo "::error::Video Height ${segment_height}px। Expected ${video_height}px"
              exit 1
            fi


            # ------------------------------------------------------
            # H.264 even-dimension verification
            # ------------------------------------------------------
            if [ $((segment_width % 2)) -ne 0 ]; then
              echo "::error::Video Width odd হয়েছে: ${segment_width}px"
              exit 1
            fi


            if [ $((segment_height % 2)) -ne 0 ]; then
              echo "::error::Video Height odd হয়েছে: ${segment_height}px"
              exit 1
            fi


            echo "✓ Video resolution verified"
            echo "✓ Width  = ${segment_width}px"
            echo "✓ Height = ${segment_height}px"
            echo "✓ Both dimensions are divisible by 2"


            # ------------------------------------------------------
            # Concat list
            # ------------------------------------------------------
            echo "file '$(pwd)/segments/${filename}.mp4'" >> concat_list.txt


            echo "✓ Done: ${filename}.mp4"
            echo ""

          done


          # ========================================================
          # Display concat list
          # ========================================================
          echo ""
          echo "============================================================"
          echo "----- concat_list.txt -----"
          echo "============================================================"

          cat concat_list.txt || true


      # ============================================================
      # 5. Validate segment compatibility before concatenation
      #
      # IMPORTANT:
      #
      # আপনার Image Generator-এর Height dynamic।
      #
      # তাই সব image-এর Height একই নাও হতে পারে।
      #
      # concat -c copy করার জন্য সব segment-এর video stream
      # parameters/resolution একই হওয়া নিরাপদ।
      #
      # এখানে প্রথম segment-এর resolution reference হিসেবে নেওয়া
      # হচ্ছে এবং পরবর্তী segment-এর resolution আলাদা হলে error
      # দেখানো হবে।
      # ============================================================
      - name: Validate segment compatibility
        run: |
          set -e

          if [ ! -s concat_list.txt ]; then
            echo "::error::কোনো valid video segment তৈরি হয়নি"
            exit 1
          fi


          first_segment=$(sed -n "s/^file '\\(.*\\)'$/\1/p" concat_list.txt | head -n 1)


          if [ -z "$first_segment" ]; then
            echo "::error::প্রথম segment পাওয়া যায়নি"
            exit 1
          fi


          reference_width=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            "$first_segment")


          reference_height=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            "$first_segment")


          echo "Reference Resolution:"
          echo "${reference_width}x${reference_height}"


          while IFS= read -r line; do

            segment=$(echo "$line" | sed "s/^file '//;s/'$//")


            current_width=$(ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width \
              -of csv=p=0 \
              "$segment")


            current_height=$(ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=height \
              -of csv=p=0 \
              "$segment")


            echo "$(basename "$segment") → ${current_width}x${current_height}"


            if [ "$current_width" != "$reference_width" ] || \
               [ "$current_height" != "$reference_height" ]; then

              echo "::error::সব video segment-এর resolution একই নয়।"
              echo "::error::Reference = ${reference_width}x${reference_height}"
              echo "::error::Current   = ${current_width}x${current_height}"
              echo "::error::Dynamic-height images-এর কারণে -c copy concatenation করা যাবে না।"

              exit 1
            fi

          done < concat_list.txt


          echo "✓ সব segment-এর resolution compatible"


      # ============================================================
      # 6. Concatenate all segments into final video
      # ============================================================
      - name: Concatenate all segments into final video
        run: |
          set -e


          if [ ! -s concat_list.txt ]; then
            echo "::error::কোনো ভ্যালিড পেয়ার পাওয়া যায়নি, ভিডিও তৈরি করা যাচ্ছে না"
            exit 1
          fi


          echo "Segments concatenate করা হচ্ছে..."


          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i concat_list.txt \
            -c copy \
            final_4k_video.mp4


          echo ""
          echo "============================================================"
          echo "FINAL VIDEO"
          echo "============================================================"


          ls -lh final_4k_video.mp4


          # --------------------------------------------------------
          # Final Width
          # --------------------------------------------------------
          final_width=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            final_4k_video.mp4)


          # --------------------------------------------------------
          # Final Height
          # --------------------------------------------------------
          final_height=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            final_4k_video.mp4)


          # --------------------------------------------------------
          # Final Duration
          # --------------------------------------------------------
          final_duration=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            final_4k_video.mp4)


          echo ""
          echo "Final Width    = ${final_width}px"
          echo "Final Height   = ${final_height}px"
          echo "Final Duration = ${final_duration}s"


          echo ""
          echo "✓ Final video successfully created."


      # ============================================================
      # 7. Upload video as workflow artifact
      # ============================================================
      - name: Upload video as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-4k-video
          path: final_4k_video.mp4
          retention-days: 7


      # ============================================================
      # 8. Create GitHub Release with the video
      # ============================================================
      - name: Create GitHub Release with the video
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_number }}
          name: 4K Video Build #${{ github.run_number }}
          files: final_4k_video.mp4

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
